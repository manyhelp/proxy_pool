[package]
name = "proxy-pool"
version = "3.0.0"
edition = "2021"
rust-version = "1.75"
description = "免费代理IP池(Rust 重写版): 采集/校验/Redis 存储/HTTP API, 与 Python 版数据与 API 兼容"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
axum = "0.8"
# TLS 用默认 native-tls: Windows 走 schannel, 无需额外系统依赖; Linux 部署需 libssl-dev
reqwest = { version = "0.12", features = ["gzip"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
regex = "1"
scraper = "0.20"
chrono = "0.4"
futures = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
